<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GRIDLOCK</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud" hidden></div>
  <div id="lobby">
    <div class="lobby-card">
      <h1>GRIDLOCK</h1>
      <p class="sub" id="sub"></p>
      <label id="universe-row" hidden>Universe <select id="universe"></select></label>
      <p class="mode-blurb" id="universe-blurb" hidden></p>
      <div id="chars"></div>
      <div id="play">
        <button id="continue" class="primary" hidden></button>
        <label>Mode <select id="mode"></select></label>
        <p class="mode-blurb" id="mode-blurb"></p>
        <div class="row">
          <button id="create" class="primary">Create game</button>
        </div>
        <div class="row">
          <input id="code" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false" />
          <button id="join">Join</button>
        </div>
        <div id="rooms"></div>
      </div>
      <p id="lobby-error" class="error"></p>
    </div>
  </div>
  <div id="loading" hidden>Loading…</div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
